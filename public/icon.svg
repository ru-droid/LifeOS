<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#272b38" stroke-width="4"/>
  <g filter="url(#glow)">
    <!-- Vertical spine of K -->
    <rect x="148" y="128" width="36" height="256" rx="18" fill="url(#amberGlow)"/>
    <!-- Diagonal top arm -->
    <path d="M184 256 L290 144 C298 136 312 136 320 144 C328 152 328 166 320 174 L236 262 Z" fill="url(#amberGlow)"/>
    <!-- Diagonal bottom arm with checkmark accent -->
    <path d="M220 248 L328 356 C336 364 336 378 328 386 C320 394 306 394 298 386 L184 272 Z" fill="url(#amberGlow)"/>
    <!-- Pulsing central indicator node -->
    <circle cx="348" cy="256" r="14" fill="#f59e0b"/>
    <circle cx="348" cy="256" r="24" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
  </g>
</svg>
